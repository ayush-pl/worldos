[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldos"
version = "0.1.0a0"
description = "WORLD-OS Alpha: a scientifically grounded, testable prototype of a civilization simulator (one synthetic country)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.5",
    "h3>=4.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worldos = "worldos.cli:main"

[tool.setuptools.packages.find]
include = ["worldos*"]

[tool.setuptools.package-data]
worldos = ["data/*.toml", "countries/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
